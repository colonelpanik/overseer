{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — overseer</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a19; --dim: #6b6b68; --line: #e3e3e0;
    --card: #ffffff; --accent: #2f5fd0;
    --green: #1f7a4d; --red: #b3261e; --amber: #9a6400; --blue: #2f5fd0; --grey: #6b6b68;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --fg: #ececea; --dim: #9a9a96; --line: #2c2c31;
      --card: #1d1d22; --accent: #7aa2f7;
      --green: #56c98a; --red: #f2726a; --amber: #e0a83b; --blue: #7aa2f7; --grey: #9a9a96;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--accent); }
  header {
    display: flex; align-items: baseline; gap: 1rem;
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1rem; margin: 0; letter-spacing: .02em; }
  header .live { font-size: .78rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: .75rem; overflow-x: auto; font-size: .82rem; margin: 0;
  }
  .badge {
    display: inline-block; padding: .1rem .45rem; border-radius: 4px;
    font-size: .72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; border: 1px solid currentColor;
  }
  .badge.green { color: var(--green); } .badge.red { color: var(--red); }
  .badge.amber { color: var(--amber); } .badge.blue { color: var(--blue); }
  .badge.grey { color: var(--grey); }
  .cards { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: .9rem 1rem; display: flex; flex-direction: column; gap: .5rem;
  }
  .card.amber { border-left: 3px solid var(--amber); }
  .card.red { border-left: 3px solid var(--red); }
  .card.green { border-left: 3px solid var(--green); }
  .card h2 { font-size: .95rem; margin: 0; font-weight: 600; }
  .meta { display: flex; flex-wrap: wrap; gap: .75rem; font-size: .78rem; color: var(--dim); }
  .meta .prog { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg); }
  form.add { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1.5rem; }
  form.add textarea, form.add input {
    font: inherit; padding: .5rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  form.add textarea { min-height: 4.5rem; resize: vertical; }
  button {
    font: inherit; font-weight: 600; padding: .45rem .9rem; cursor: pointer;
    border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .step {
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    margin-bottom: .75rem;
  }
  .step > summary { padding: .6rem .9rem; cursor: pointer; display: flex; gap: .6rem; align-items: center; }
  .step .body { padding: 0 .9rem .9rem; }
  .agent { font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  .agent.claude { color: var(--accent); }
  .agent.codex { color: var(--amber); }
  .agent.verify { color: var(--green); }
  ul.findings { list-style: none; padding: 0; margin: .5rem 0 0; }
  ul.findings li { padding: .35rem 0; border-top: 1px solid var(--line); font-size: .88rem; }
  .sev { font-size: .7rem; font-weight: 700; text-transform: uppercase; margin-right: .4rem; }
  .sev.critical, .sev.major { color: var(--red); }
  .sev.minor { color: var(--amber); }
  .sev.nit { color: var(--dim); }
  .loc { color: var(--dim); font-size: .82rem; }
  .empty { color: var(--dim); padding: 2rem 0; }
  .banner {
    border: 1px solid var(--amber); border-left-width: 3px; border-radius: 6px;
    padding: .75rem 1rem; margin-bottom: 1.25rem; background: var(--card);
  }
</style>
</head>
<body>
<header>
  <h1><a href="/" style="text-decoration:none;color:inherit">overseer</a></h1>
  <span class="live" id="live">connecting…</span>
</header>
<main>
  {{if .PauseReason}}
  <div class="banner" style="border-color:var(--red)">
    <p style="margin:0 0 .6rem"><strong>Run paused:</strong> {{.PauseReason}}</p>
    <p class="meta" style="margin:0 0 .6rem">No tasks will start until this is cleared. Log the CLI in, then resume.</p>
    <form method="post" action="/resume"><button class="primary" type="submit">Resume run</button></form>
  </div>
  {{end}}
  {{template "content" .}}
</main>
<script>
  // Reload on any state change the daemon reports. The pages are cheap to
  // render server-side, so a reload is simpler and less to get wrong than
  // patching the DOM.
  const es = new EventSource("/events");
  const live = document.getElementById("live");
  es.onopen = () => { live.textContent = "live"; };
  es.onerror = () => { live.textContent = "reconnecting…"; };
  es.addEventListener("change", () => { location.reload(); });
</script>
</body>
</html>{{end}}

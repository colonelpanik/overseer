# Submit with: overseer submit tasks.example.yaml
#
# Daemon settings (max_parallel, max_iterations, step_timeout,
# blocking_severity) live in ~/.overseer/config.yaml, not here — so
# submitting a batch cannot change the behaviour of a run already going.
tasks:
  - repo: /home/kal/code/dc-planner
    # Optional. One line, and what the task is listed under on the board, in
    # its branch name and in its pull request title. Left out, it is derived
    # from the goal's first sentence.
    subject: Add CSV export to the rack inventory
    goal: |
      Add CSV export to the rack inventory view. Follow the existing
      server-rendered pattern; the operator downloads the file rather than
      seeing it in the page.
    constraints:
      - Server-rendered, no new JS dependencies
      - Follow the existing repo_*.go pattern in internal/store

  - repo: /home/kal/code/clanker
    goal: Replace the hand-rolled retry logic with a shared backoff helper.
    # Nits will not hold this one up.
    blocking_severity: major
    # Advisory: passing it raises a banner on the dashboard, nothing more.
    cost_cap: 8.00

  - repo: /home/kal/code/dc-planner
    goal: Add a column picker to the rack inventory view.
    # Waits for the earlier task to reach done. The name is that task's slug,
    # derived from its subject when it has one, and from its goal — exactly as
    # before — when it does not; a slug nothing matches fails the submit.
    depends_on:
      - add-csv-export-to-the-rack-inventory
